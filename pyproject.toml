[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kosma-ocs-translator"
version = "0.2.0"
description = "Fills the KOSMA telescope seat at FYST: KOSMA file io in, OCS program tracks out"
authors = [
    {name = "Ronan Higgins", email = "higgins@ph1.uni-koeln.de"},
    {name = "Christof Buchbender", email = "buchbend@ph1.uni-koeln.de"},
]
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "numpy",
    "ocs @ git+ssh://git@github.com/ccatobs/observatory-control-system.git@24c56f6639bfe633d4aef67d069aaa5f42742b63#subdirectory=clients/python",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kosma_ocs_translator = "kosma_ocs_translator.translator:main"

[tool.setuptools]
packages = ["kosma_ocs_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["utils"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
